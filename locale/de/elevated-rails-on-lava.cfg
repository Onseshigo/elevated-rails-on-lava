[mod-name]
elevated-rails-on-lava=Hochbahn auf Lava
[mod-description]
elevated-rails-on-lava=Ermöglicht den Bau erhöhter Schienen auf der Lava nach der Erforschung der Technologie "[technology=rail-support-foundations] [font=default-bold]Gleisstütze[/font]".\nFügt der Technologie ein visuelles Symbol hinzu, um die Änderung anzuzeigen.\nHat Einstellungen, für welche Kacheln mit der Technologieforschung geändert werden müssen.
[modifier-description]
rail-support-on-lava=Erlaubt den Bau von Hochbahnen auch auf Lava.
[mod-setting-name]
elevated-rails-on-lava-changed-tiles=Geänderte Kacheln
elevated-rails-on-lava-technology-effect-icon=Symbol für Technologie-Effekt
[mod-setting-description]
elevated-rails-on-lava-changed-tiles=Welche Kacheln werden von Mod beeinflusst.\nErlaubt das Hinzufügen von Kacheln von anderen Mods, auf die du keine Schienen setzen kannst.\nGebe diese mit einem Komma an, Leerzeichen zwischen den Wörtern werden ignoriert.
elevated-rails-on-lava-technology-effect-icon=Gibt an, ob ein Effekt-Icon der "Fundamente für Gleisstützen"-Technologie hinzugefügt werden soll.

