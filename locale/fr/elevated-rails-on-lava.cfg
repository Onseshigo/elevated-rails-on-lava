[mod-name]
elevated-rails-on-lava=Supports Ferroviaires dans la Lave (Elevated Rails on Lava)
[mod-description]
elevated-rails-on-lava=Ce mod permet de construire des supports ferroviaires (et des rails surélevés) dans la lave dès que la technologie "[technology=rail-support-foundations] [font=default-bold]Foundations de support ferroviaires[/font]" est recherchée.\nIl change aussi l'icône de la technologie pour indiquer ce changement.\nLe mod possède des options de personnalisation pour définir d'autres cases sur lesquels les supports ferroviaires peuvent être construits grâce cette technologie.
[modifier-description]
rail-support-on-lava=Permet aussi de construire des supports ferroviaires dans la lave.
[mod-setting-name]
elevated-rails-on-lava-changed-tiles=Cases modifiées
elevated-rails-on-lava-technology-effect-icon=Modifier l'icône de technologie
[mod-setting-description]
elevated-rails-on-lava-changed-tiles=Définit les cases affectées par le mod.\nPermet d'ajouter des cases d'autres mods sur lesquelles vous ne pouvez pas placer de rails en temps normal.\nLes noms sont à séparer avec des virgules ; les espaces ne seront pas pris en compte.
elevated-rails-on-lava-technology-effect-icon=Si activé, ajoute une icône supplémentaire à l'icône de la technologie "Foundation de support ferroviaire".

